<div class="header-wrapper">
    <header>
        <div class="header-content">
            <div class="header-title" [class.header-title--clickable]="devMode.isEnabled" (click)="devMode.isEnabled && router.navigate(['/'])">Pohlscher Resonator</div>
            <div class="header-subtitle">Praktikum zu Experimentalphysik I</div>
            <!-- Debug: Show session ID -->
            @if (sessionService.hasValidSession()) {
                <div class="session-debug">
                    Session: {{ sessionService.sessionId() }}
                </div>
            }
            <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
                <img [src]="themeService.themeIconPath()" [alt]="themeService.isDarkMode() ? 'Dark mode' : 'Light mode'">
            </button>
        </div>
    </header>
    
    <!-- Sticky lines (stick on scroll) -->
    <div class="header-lines" [class.sticky]="isScrolled">
        <!-- <div class="line line-i"></div> -->
        <div class="line line-1"></div>
        <div class="line line-i"></div>
        <div class="line line-2"></div>
    </div>
</div>
