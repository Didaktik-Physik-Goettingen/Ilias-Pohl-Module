@if (visible) {
    <div class="dock" [class.dock--header]="placement === 'header'" [class.dock--nav]="placement === 'nav'">
        <button type="button" class="dock-btn" [disabled]="locked" [attr.title]="lockHint ?? 'Glossar'"
            [attr.aria-label]="placement === 'header' ? 'Glossar' : null" (click)="openGlossary()">
            <svg class="dock-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.6C6.6 2.6 4.6 2.1 2 2.1v10.4c2.6 0 4.6.5 6 1.5 1.4-1 3.4-1.5 6-1.5V2.1c-2.6 0-4.6.5-6 1.5zM8 3.6V14"/>
            </svg>
            @if (placement === 'nav') {
                <span class="dock-label">Glossar</span>
            }
        </button>
        <button type="button" class="dock-btn" [disabled]="locked" [attr.title]="lockHint ?? 'Meine Markierungen'"
            [attr.aria-label]="placement === 'header' ? 'Meine Markierungen (' + markCount + ')' : null" (click)="openMarks()">
            <svg class="dock-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10.4 2.2l3.4 3.4-6.2 6.2H4.9L4.2 11V8.4zM4.2 11.1 2 13.8h3.7M8.3 4.3l3.4 3.4"/>
            </svg>
            @if (placement === 'nav') {
                <span class="dock-label">Markierungen</span>
            }
            @if (markCount > 0) {
                <span class="dock-count" aria-hidden="true">{{ markCount }}</span>
            }
        </button>
    </div>
}
