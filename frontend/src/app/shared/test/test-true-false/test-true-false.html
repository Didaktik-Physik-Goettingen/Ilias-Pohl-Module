<div class="test-container" [id]="containerId" [class.submitted]="isSubmitted">
    <div class="test-content">
        <h3 class="test-question" [innerHTML]="question"></h3>
        <p class="test-instruction" [innerHTML]="questionInstruction" ></p>
        <div class="statements-container">
            @for (statement of shuffledStatements; track statement.id; let i = $index) {
            <div
                class="statement-item"
                [class.selected]="getSelectedValue(statement.id) !== null && !isSubmitted"
                [class.disabled]="isSubmitted">

                <div class="statement-text" [innerHTML]="statement.text"></div>

                <div class="statement-right">
                    <div class="statement-options">
                        <button
                            type="button"
                            class="testtf-btn"
                            [class.selected]="getSelectedValue(statement.id) === 'true' && !isSubmitted"
                            [class.correct]="isSubmitted && getSelectedValue(statement.id) === 'true' && statement.isCorrect"
                            [class.incorrect]="isSubmitted && getSelectedValue(statement.id) === 'true' && !statement.isCorrect"
                            [disabled]="isSubmitted"
                            (click)="toggleStatement(statement.id, 'true')">
                            Wahr
                            @if (isSubmitted && getSelectedValue(statement.id) === 'true') {
                                <span class="testtf-indicator">{{ statement.isCorrect ? '✓' : '✗' }}</span>
                            }
                        </button>

                        <button
                            type="button"
                            class="testtf-btn"
                            [class.selected]="getSelectedValue(statement.id) === 'false' && !isSubmitted"
                            [class.correct]="isSubmitted && getSelectedValue(statement.id) === 'false' && !statement.isCorrect"
                            [class.incorrect]="isSubmitted && getSelectedValue(statement.id) === 'false' && statement.isCorrect"
                            [disabled]="isSubmitted"
                            (click)="toggleStatement(statement.id, 'false')">
                            Falsch
                            @if (isSubmitted && getSelectedValue(statement.id) === 'false') {
                                <span class="testtf-indicator">{{ !statement.isCorrect ? '✓' : '✗' }}</span>
                            }
                        </button>
                    </div>

                    @if (isSubmitted && getSelectedValue(statement.id) === null) {
                    <span class="richtige-antwort-badge--neutral">
                        Richtige Antwort: {{ statement.isCorrect ? 'Wahr' : 'Falsch' }}
                    </span>
                    }
                </div>
            </div>
            }
        </div>

        <button
            class="test-btn test-submit-btn"
            (click)="submitAnswer()"
            [disabled]="isSubmitted">
            {{ isSubmitted ? 'Bereits abgegeben' : 'Abgeben' }}
        </button>

        @if (isSubmitted) {
        <div
            class="test-result"
            [class.correct]="isCorrect"
            [class.partial]="!isCorrect && pointsAwarded > 0"
            [class.incorrect]="pointsAwarded === 0">
            <p>{{ feedbackMessage }}</p>
            <div class="points-breakdown" [innerHTML]="pointsBreakdown"></div>
        </div>
        }
    </div>
</div>
