<div class="test-results-container" [class]="getPerformanceClass()">
    <!-- <h2 class="results-title">{{ testTitle }} - Ergebnis</h2> -->
    
    <!-- Score Display -->
    <div class="score-display">
        <div class="score-value">
            <span class="points-earned">{{ totalPoints }}</span>
            <span class="points-separator">/</span>
            <span class="points-max">{{ maxPoints }}</span>
        </div>
        <div class="score-label">Punkte</div>
    </div>

    <!-- Percentage Display -->
    <div class="percentage-display">
        <span class="percentage-value">{{ percentage | number:'1.0-1' }}%</span>
    </div>

    <!-- Performance Message -->
    <div class="performance-message">
        <p [innerHTML]="performanceMessage"></p>
    </div>

    <!-- Continue Button -->
    <!-- <div class="continue-action">
        <a [routerLink]="continueLink" class="btn btn-continue">
            {{ continueLinkText }}
        </a>
    </div> -->

    <!-- Personalised learning-path PDF download -->
    @if (canDownloadReport) {
        <div class="download-action no-print">
            <button type="button" class="btn btn-primary" (click)="downloadLearningPath()"
                    [disabled]="isGeneratingReport">
                {{ isGeneratingReport ? 'Wird erstellt …' : 'individuellen Lernpfad herunterladen' }}
            </button>
            @if (isGeneratingReport) {
                <p class="download-hint">
                    Ihr Lernpfad wird zusammengestellt — dies kann einen Moment dauern.
                </p>
            }
            @if (reportError) {
                <p class="download-error">
                    Der Download ist fehlgeschlagen. Bitte versuchen Sie es erneut.
                </p>
            }
        </div>
    }
</div>
