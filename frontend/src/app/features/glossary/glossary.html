<div class="container">
    <div class="card">
        <h1>Glossar</h1>
        <p class="glossary-intro">Wichtige Begriffe zum Pohlschen Rad und harmonischen Schwingungen</p>
        
        <div class="search-box">
            <input 
                type="text" 
                placeholder="Begriff suchen..." 
                [(ngModel)]="searchTerm"
                (input)="filterTerms()"
            >
        </div>

        <!-- each term is a card, as on the landing page; with a link, the whole card opens the term -->
        <div class="glossary-list">
            @for (term of filteredTerms; track term.title) {
                @if (term.link) {
                    <a [routerLink]="term.link" class="glossary-item">
                        <h2 class="term-title">{{ term.title }}</h2>
                        <p class="term-definition">{{ term.definition }}</p>
                    </a>
                } @else {
                    <div class="glossary-item">
                        <h2 class="term-title">{{ term.title }}</h2>
                        <p class="term-definition">{{ term.definition }}</p>
                    </div>
                }
            }
        </div>

        <div class="button-container">
            <a routerLink="/" class="btn">← Zurück zur Startseite</a>
        </div>
    </div>
</div>
