<div class="container">
    <div class="card">
        <h1>Grundbausteine Simulation</h1>
        <p class="page-subheadline">DGLs numerisch lösen</p>

        <div class="content">
            <p [innerHTML]="simText1a"></p>

            <div class="glossary-write">
                <div class="glossary-text" [innerHTML]="simText1b"></div>
            </div>

            <p [innerHTML]="simText1c"></p>

            <div class="method-cards">
                <div class="method-card">
                    <h3>Euler-Verfahren</h3>
                    <p [innerHTML]="simText1d"></p>
                </div>
                <div class="method-card">
                    <h3>Runge-Kutta-Verfahren (RK4)</h3>
                    <p [innerHTML]="simText1e"></p>
                </div>
            </div>

            <p [innerHTML]="simText1f"></p>

            <div class="notebook-download">
                <!-- <h3>Jupyter Notebook zu Simulationen</h3> -->
                <div class="target-downloads">
                    <a class="target-download-btn"
                       href="assets/target/HarmOsc_RK_lueckenskript.ipynb"
                       download>
                        ↓ HarmOsc_RK_lueckenskript.ipynb
                        <span class="target-file-size">285.71 KB</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="button-container">
            <button class="btn btn-back" (click)="goBack()">← Zurück zum Testergebnis</button>
            <button class="btn" (click)="goForward()">Weiter zum Versuchsaufbau →</button>
        </div>
    </div>
</div>
